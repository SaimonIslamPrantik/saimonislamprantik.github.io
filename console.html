<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>console - prantik</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --lavender: #e3d7ff;
      --green: #95e06c;
      --coral: #ff5a5f;
      --deep-purple: #4c2c72;
      --soft-cyan: #7ee8fa;
      --bg-green-pastel: #f0f7ee;
      --grid-line-color: rgba(149, 224, 108, 0.28);
      --card-bg: #ffffff;
      --text-muted: #745b91;
      --border-crisp: #4c2c72;
      --spring-slide: cubic-bezier(0.2, 0.9, 0.3, 1.25);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body, button, input, textarea {
      font-family: 'Hanken Grotesk', sans-serif;
    }

    body {
      background-color: var(--bg-green-pastel);
      background-image: 
        linear-gradient(to right, var(--grid-line-color) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, var(--grid-line-color) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: var(--deep-purple);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 18px 90px;
    }
