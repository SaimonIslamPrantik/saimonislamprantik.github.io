name: Deploy Website with Secrets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets
        env:
          SP_URL: ${{ secrets.SUPABASE_URL }}
          SP_KEY: ${{ secrets.SUPABASE_KEY }}
          LFM_USER: ${{ secrets.LASTFM_USER }}
          LFM_KEY: ${{ secrets.LASTFM_KEY }}
        run: |
          sed -i "s|__SUPABASE_URL__|${SP_URL}|g" index.html
          sed -i "s|__SUPABASE_KEY__|${SP_KEY}|g" index.html
          sed -i "s|__LASTFM_USER__|${LFM_USER}|g" index.html
          sed -i "s|__LASTFM_KEY__|${LFM_KEY}|g" index.html
          sed -i "s|__SUPABASE_URL__|${SP_URL}|g" console.html
          sed -i "s|__SUPABASE_KEY__|${SP_KEY}|g" console.html
          sed -i "s|__LASTFM_USER__|${LFM_USER}|g" console.html
          sed -i "s|__LASTFM_KEY__|${LFM_KEY}|g" console.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
