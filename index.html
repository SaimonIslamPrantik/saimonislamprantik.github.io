<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <title>prantik</title>
  
  <!-- Google Fonts: Hanken Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Markdown Parser (Marked) & HTML Sanitizer (DOMPurify) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

  <!-- HLS.js for .m3u8 Live & VOD Streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <!-- Divcord Embed Bridge -->
  <script src="https://divcord.gg/embed.js"></script>
  
  <style>
    /* Local font replacing Darumadrop One */
    @font-face {
      font-family: 'Pricedown';
      src: url('Pricedown Bl.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --lavender: #e3d7ff;
      --green: #95e06c;
      --coral: #ff5a5f;
      --live-red: #ff2a3c;
      --deep-purple: #4c2c72;
      --soft-cyan: #7ee8fa;

      /* Light Theme Base */
      --bg-page: #f0f7ee;
      --grid-line-color: rgba(149, 224, 108, 0.28);
      --card-bg: #ffffff;
      --text-main: #4c2c72;
      --text-muted: #745b91;
      --border-crisp: #4c2c72;

      /* Placeholder Behind Pop */
      --placeholder-bg: #e3d7ff;
      --placeholder-border: rgba(76, 44, 114, 0.35);
      --placeholder-stamp: rgba(76, 44, 114, 0.4);

      /* Glow & Ambient */
      --glow-top: rgba(227, 215, 255, 0.8);
      --glow-mid: rgba(126, 232, 250, 0.3);
      --vote-bg: #faf8fd;

      --spring-slide: cubic-bezier(0.2, 0.9, 0.3, 1.25);
    }

    /* Dark Mode Overrides */
    body.dark-mode {
      --bg-page: #0e1410;
      --grid-line-color: rgba(149, 224, 108, 0.14);
      --card-bg: #181124;
      --text-main: #f0eaff;
      --text-muted: #b49fcf;
      --border-crisp: #885bc4;

      --placeholder-bg: #2d1d42;
      --placeholder-border: rgba(227, 215, 255, 0.3);
      --placeholder-stamp: rgba(227, 215, 255, 0.35);

      --glow-top: rgba(136, 91, 196, 0.35);
      --glow-mid: rgba(126, 232, 250, 0.12);
      --vote-bg: #221733;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    /* Bubble & Carousel Dot exemptions so they stay rounded */
    .music-bubble,
    .music-bubble-tail,
    .music-bubble-dot,
    .sound-bar,
    .carousel-dot,
    .hls-dot {
      border-radius: 9999px !important;
    }

    /* Primary font for body & UI remains Hanken Grotesk */
    body, button, input, textarea, select {
      font-family: 'Hanken Grotesk', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      background-image: 
        linear-gradient(to right, var(--grid-line-color) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, var(--grid-line-color) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 18px 90px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 94vw;
      max-width: 1300px;
      height: 520px;
      background: radial-gradient(
        ellipse at top, 
        var(--glow-top) 0%, 
        var(--glow-mid) 45%, 
        transparent 75%
      );
      pointer-events: none;
      z-index: 0;
      filter: blur(32px);
      transition: background 0.3s ease;
    }

    /* Top-Right Theme Toggle Button */
    .theme-toggle-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 3px 3px 0 var(--border-crisp);
      transition: transform 0.18s var(--spring-slide), background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle-btn:hover {
      transform: translate(-2px, -2px);
      background: var(--soft-cyan);
      color: #181124;
    }

    .container {
      width: min(96%, 1160px);
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    .pop-shell {
      position: relative;
      background-color: var(--placeholder-bg);
      border: 2px dashed var(--placeholder-border);
      margin-top: 10px;
      margin-left: 10px;
      transition: background-color 0.25s ease;
    }

    .pop-shell::after {
      content: "✦ PLACEHOLDER";
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--placeholder-stamp);
      pointer-events: none;
      z-index: 0;
    }

    .slide-card {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      width: 100%;
      z-index: 1;
      transition: transform 0.22s var(--spring-slide), box-shadow 0.22s ease, background-color 0.25s ease, border-color 0.25s ease;
      cursor: default;
    }

    .pop-shell:hover .slide-card,
    .pop-shell:active .slide-card,
    .pop-shell:focus-within .slide-card {
      transform: translate(-10px, -10px);
      box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.25);
    }

    /* Cover: cover.png */
    .banner {
      height: 155px;
      width: 100%;
      background: url('cover.png') center center/cover no-repeat, linear-gradient(135deg, var(--lavender) 0%, var(--soft-cyan) 60%, #b8f0f9 100%);
      position: relative;
      border-bottom: 2px solid var(--border-crisp);
    }

    /* Cover Bottom-Right Wiki Globe Button */
    .banner-wiki-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      z-index: 5;
      box-shadow: 3px 3px 0 var(--border-crisp);
      transition: transform 0.18s var(--spring-slide), background-color 0.2s ease, color 0.2s ease, box-shadow 0.18s ease;
    }

    .banner-wiki-btn:hover,
    .banner-wiki-btn:focus-visible {
      transform: translate(-2px, -2px);
      background: var(--soft-cyan);
      color: #181124;
      box-shadow: 5px 5px 0 var(--border-crisp);
    }

    .banner-wiki-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 var(--border-crisp);
    }

    .profile-details {
      padding: 0 28px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 24px;
      position: relative;
    }

    /* Avatar: profile.png */
    .avatar-wrapper {
      position: relative;
      margin-top: -55px;
      flex-shrink: 0;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border: 4px solid var(--card-bg);
      outline: 2px solid var(--border-crisp);
      background: var(--lavender);
      object-fit: cover;
      display: block;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, border-color 0.25s ease, outline-color 0.25s ease, box-shadow 0.25s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    /* Red Live Border on Profile Picture when Live or HLS Post Exists */
    .avatar-wrapper.is-live .avatar {
      border: 4px solid var(--live-red);
      outline: 3px solid var(--live-red);
      box-shadow: 0 0 0 3px rgba(255, 42, 60, 0.35), 0 6px 22px rgba(255, 42, 60, 0.6);
      animation: liveAvatarPulse 2s ease-in-out infinite;
    }

    .avatar-live-badge {
      display: none;
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--live-red);
      color: #ffffff;
      border: 2px solid var(--border-crisp);
      padding: 2px 8px;
      font-size: 0.66rem;
      font-weight: 900;
      letter-spacing: 0.9px;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      z-index: 6;
      box-shadow: 2px 2px 0 var(--border-crisp);
    }

    .avatar-wrapper.is-live .avatar-live-badge {
      display: inline-flex;
    }

    @keyframes liveAvatarPulse {
      0%, 100% {
        box-shadow: 0 0 0 2px rgba(255, 42, 60, 0.35), 0 6px 18px rgba(255, 42, 60, 0.5);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(255, 42, 60, 0.5), 0 6px 26px rgba(255, 42, 60, 0.8);
      }
    }

    @keyframes liveDotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .hls-dot {
      width: 7px;
      height: 7px;
      background: #ffffff;
      display: inline-block;
      flex-shrink: 0;
      animation: liveDotPulse 1.2s ease-in-out infinite;
    }

    /* ================= LIVE LAST.FM STATUS BUBBLE ================= */
    .music-bubble-container {
      position: absolute;
      top: -62px;
      left: -10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: floatBubble 3s ease-in-out infinite alternate;
      pointer-events: auto;
    }

    .music-bubble {
      background: #25143a;
      border: 2px solid var(--border-crisp);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      max-width: 260px;
      cursor: pointer;
      transition: transform 0.2s var(--spring-slide), background-color 0.2s ease;
    }

    .music-bubble:hover {
      transform: scale(1.05);
      background: #381f57;
    }

    .equalizer-bars {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
      flex-shrink: 0;
    }

    .sound-bar {
      width: 3px;
      background-color: #ffffff;
      animation: bounceBar 1.2s ease-in-out infinite alternate;
    }

    .sound-bar:nth-child(1) { height: 7px; animation-delay: 0.1s; }
    .sound-bar:nth-child(2) { height: 15px; animation-delay: 0.3s; }
    .sound-bar:nth-child(3) { height: 10px; animation-delay: 0.5s; }

    .music-bubble-container.paused .sound-bar {
      animation: none;
      height: 6px;
    }

    @keyframes bounceBar {
      0% { height: 4px; }
      100% { height: 15px; }
    }

    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .music-bubble-info {
      display: flex;
      flex-direction: column;
      line-height: 1.22;
      overflow: hidden;
      white-space: nowrap;
    }

    .music-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .music-artist {
      font-size: 0.72rem;
      color: #d1b8ff;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .music-bubble-tail {
      width: 10px;
      height: 10px;
      background: #25143a;
      border: 1.5px solid var(--border-crisp);
      margin-left: 22px;
      margin-top: -3px;
    }

    .music-bubble-dot {
      width: 5px;
      height: 5px;
      background: #25143a;
      border: 1px solid var(--border-crisp);
      margin-left: 28px;
      margin-top: 2px;
    }

    /* Mobile Responsive Rule for the Bubble */
    @media (max-width: 600px) {
      .music-bubble-container {
        top: -56px;
        left: -4px;
      }
      .music-bubble {
        max-width: 215px;
        padding: 6px 12px;
        gap: 7px;
      }
      .music-title {
        font-size: 0.76rem;
        max-width: 140px;
      }
      .music-artist {
        font-size: 0.68rem;
        max-width: 140px;
      }
    }

    /* Profile Info & Name Badges */
    .profile-info {
      margin-top: 10px;
      flex: 1;
      min-width: 280px;
    }

    /* Heading: Using Pricedown instead of Darumadrop One */
    .profile-info h1 {
      font-family: 'Pricedown', sans-serif;
      font-size: 2.3rem;
      font-weight: 400;
      color: var(--text-main);
      letter-spacing: 0.8px;
      line-height: 1.05;
      text-transform: lowercase;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Badges beside name */
    .name-badge {
      height: 0.85em;
      width: auto;
      object-fit: contain;
      vertical-align: middle;
      display: inline-block;
      flex-shrink: 0;
    }

    .handle {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .bio {
      margin-top: 10px;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text-main);
      max-width: 850px;
      opacity: 0.95;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .tags {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      background-color: var(--lavender);
      color: #2b1742;
      border: 1px solid var(--border-crisp);
      cursor: pointer;
      box-shadow: 0 0 0 transparent;
      transition: transform 0.2s var(--spring-slide), background-color 0.18s ease, box-shadow 0.2s ease;
    }

    body.dark-mode .tag {
      background-color: #2b1a3f;
      color: var(--lavender);
    }

    .tag:hover,
    .tag:active {
      transform: translate(-3px, -3px);
      background-color: var(--soft-cyan) !important;
      color: #181124 !important;
      box-shadow: 3px 3px 0 var(--border-crisp);
    }

    /* Post Card */
    .post-card-inner {
      padding: 22px 24px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .post-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .post-mini-avatar {
      width: 44px;
      height: 44px;
      object-fit: cover;
      background: var(--lavender);
      border: 2px solid var(--border-crisp);
    }

    .post-author {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .post-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .members-pill {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      padding: 4px 10px;
      background: var(--lavender);
      color: #2b1742;
      border: 2px solid var(--border-crisp);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 2px 0 var(--border-crisp);
    }

    body.dark-mode .members-pill {
      background: #2b1a3f;
      color: var(--lavender);
    }

    .members-pill.unlocked {
      background: var(--green);
      color: #1b380b;
    }

    /* Members-Only Lock Box */
    .members-lock-box {
      background: var(--vote-bg);
      border: 2px dashed var(--border-crisp);
      padding: 24px 20px;
      margin: 6px 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .members-lock-icon {
      width: 46px;
      height: 46px;
      background: var(--placeholder-bg);
      border: 2px solid var(--border-crisp);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--text-main);
      box-shadow: 3px 3px 0 var(--border-crisp);
    }

    .members-lock-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .members-lock-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      font-weight: 600;
      max-width: 440px;
      line-height: 1.45;
    }

    .members-unlock-form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
      max-width: 420px;
    }

    .members-code-input {
      flex: 1;
      min-width: 200px;
      background: var(--card-bg);
      color: var(--text-main);
      border: 2px solid var(--border-crisp);
      padding: 9px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      outline: none;
    }

    .members-code-input:focus {
      box-shadow: 3px 3px 0 var(--border-crisp);
    }

    .members-unlock-btn {
      background: var(--green);
      color: #1b380b;
      border: 2px solid var(--border-crisp);
      padding: 9px 18px;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--border-crisp);
      transition: transform 0.16s var(--spring-slide), background-color 0.16s ease;
    }

    .members-unlock-btn:hover {
      background: var(--soft-cyan);
      color: #181124;
      transform: translate(-2px, -2px);
    }

    .members-code-error {
      display: none;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--coral);
      margin-top: 4px;
    }

    .post-content {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-main);
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ================= MARKDOWN CONTENT STYLING ================= */
    .post-content.markdown-body {
      white-space: normal;
    }

    .post-content.markdown-body > *:first-child {
      margin-top: 0;
    }

    .post-content.markdown-body > *:last-child {
      margin-bottom: 0;
    }

    .post-content.markdown-body h1,
    .post-content.markdown-body h2,
    .post-content.markdown-body h3,
    .post-content.markdown-body h4,
    .post-content.markdown-body h5,
    .post-content.markdown-body h6 {
      color: var(--text-main);
      font-weight: 800;
      line-height: 1.3;
      margin: 1.05em 0 0.45em;
    }

    .post-content.markdown-body h1 {
      font-size: 1.48rem;
      border-bottom: 2px solid var(--border-crisp);
      padding-bottom: 4px;
    }

    .post-content.markdown-body h2 {
      font-size: 1.25rem;
      border-bottom: 1.5px dashed var(--placeholder-border);
      padding-bottom: 3px;
    }

    .post-content.markdown-body h3 { font-size: 1.1rem; }
    .post-content.markdown-body h4 { font-size: 1rem; }
    .post-content.markdown-body h5,
    .post-content.markdown-body h6 {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .post-content.markdown-body p {
      margin-bottom: 0.78em;
    }

    .post-content.markdown-body ul,
    .post-content.markdown-body ol {
      padding-left: 1.55em;
      margin-bottom: 0.8em;
    }

    .post-content.markdown-body li {
      margin-bottom: 0.25em;
    }

    .post-content.markdown-body li > input[type="checkbox"] {
      margin-right: 6px;
      accent-color: var(--green);
      vertical-align: middle;
    }

    .post-content.markdown-body a {
      color: var(--deep-purple);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
      background: rgba(126, 232, 250, 0.22);
      padding: 0 2px;
    }

    body.dark-mode .post-content.markdown-body a {
      color: var(--soft-cyan);
      background: rgba(126, 232, 250, 0.1);
    }

    .post-content.markdown-body a:hover {
      background: var(--soft-cyan);
      color: #181124;
    }

    .post-content.markdown-body blockquote {
      border-left: 4px solid var(--border-crisp);
      background: var(--vote-bg);
      padding: 8px 14px;
      margin: 0.85em 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .post-content.markdown-body blockquote > *:last-child {
      margin-bottom: 0;
    }

    .post-content.markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86em;
      background: var(--vote-bg);
      border: 1px solid var(--placeholder-border);
      padding: 1px 5px;
      color: var(--text-main);
    }

    .post-content.markdown-body pre {
      background: #1b1229;
      color: #f0eaff;
      border: 2px solid var(--border-crisp);
      padding: 12px 14px;
      margin: 0.85em 0;
      overflow-x: auto;
      line-height: 1.5;
      box-shadow: 3px 3px 0 var(--placeholder-bg);
    }

    .post-content.markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 0.85rem;
    }

    .post-content.markdown-body hr {
      border: none;
      border-top: 2px dashed var(--border-crisp);
      margin: 1.1em 0;
      opacity: 0.7;
    }

    .post-content.markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.9em 0;
      font-size: 0.9rem;
      display: block;
      overflow-x: auto;
    }

    .post-content.markdown-body th,
    .post-content.markdown-body td {
      border: 2px solid var(--border-crisp);
      padding: 7px 12px;
      text-align: left;
    }

    .post-content.markdown-body th {
      background: var(--placeholder-bg);
      font-weight: 800;
    }

    .post-content.markdown-body img {
      max-width: 100%;
      max-height: 360px;
      height: auto;
      border: 2px solid var(--border-crisp);
      margin: 6px 0;
      display: block;
      cursor: pointer;
    }

    /* Single Media Frame */
    .post-media-frame {
      display: inline-block;
      position: relative;
      max-width: 330px;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      margin-bottom: 16px;
      padding: 4px;
      box-shadow: 4px 4px 0 var(--placeholder-bg);
    }

    .post-media {
      max-width: 100%;
      max-height: 230px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .btn-fullscreen-trigger {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--border-crisp);
      color: var(--card-bg);
      border: 1px solid var(--border-crisp);
      width: 30px;
      height: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      transition: background 0.2s ease, transform 0.2s var(--spring-slide);
    }

    .btn-fullscreen-trigger:hover {
      background: var(--soft-cyan);
      color: #181124;
      transform: translate(-2px, -2px);
    }

    /* ================= INSTAGRAM-LIKE IMAGE CAROUSEL ================= */
    .post-carousel {
      max-width: 440px;
      width: 100%;
      margin-bottom: 16px;
    }

    .carousel-viewport {
      position: relative;
      background: var(--vote-bg);
      border: 2px solid var(--border-crisp);
      box-shadow: 4px 4px 0 var(--placeholder-bg);
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #140d21;
      height: clamp(230px, 52vw, 350px);
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .carousel-counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(24, 17, 36, 0.88);
      color: #ffffff;
      border: 1.5px solid var(--lavender);
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      z-index: 4;
      pointer-events: none;
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      background: rgba(24, 17, 36, 0.85);
      color: #ffffff;
      border: 2px solid var(--lavender);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 4;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .carousel-nav:hover {
      background: var(--soft-cyan);
      color: #181124;
      border-color: var(--border-crisp);
    }

    .carousel-nav.prev { left: 8px; }
    .carousel-nav.next { right: 8px; }

    .carousel-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .carousel-dot {
      width: 7px;
      height: 7px;
      background: var(--placeholder-border);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s ease, background-color 0.18s ease;
    }

    .carousel-dot.active {
      background: var(--text-main);
      transform: scale(1.3);
    }

    /* Video Player & HLS Live Player */
    .cozy-player-wrapper {
      display: inline-block;
      position: relative;
      max-width: 360px;
      width: 100%;
      border: 2px solid var(--border-crisp);
      background: #000000;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0 var(--placeholder-bg);
      overflow: hidden;
      user-select: none;
    }

    .cozy-video-element {
      width: 100%;
      max-height: 220px;
      min-height: 180px;
      display: block;
      object-fit: contain;
      cursor: pointer;
    }

    /* HLS Live Stream + Fullscreen-Only Live Chat Layout */
    .hls-live-layout {
      width: 100%;
    }

    .cozy-player-wrapper.is-hls {
      display: block;
      width: 100%;
      max-width: 100%;
      border-color: var(--live-red);
      box-shadow: 4px 4px 0 rgba(255, 42, 60, 0.35);
      margin-bottom: 16px;
    }

    .cozy-player-wrapper.is-hls .cozy-video-element {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 75vh;
      min-height: 0;
      display: block;
      object-fit: contain;
      background: #000000;
    }

    /* Chat is NOT visible in feed; only in fullscreen when clicked */
    .hls-chat-panel {
      display: none;
    }

    .hls-chat-header {
      background: #2d1d42;
      color: #f0eaff;
      border-bottom: 2px solid #885bc4;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .hls-chat-title {
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #f0eaff;
    }

    .hls-chat-title .hls-dot {
      background: var(--green);
    }

    .hls-chat-minimize-btn {
      width: 30px;
      height: 28px;
      background: #181124;
      color: #f0eaff;
      border: 2px solid #885bc4;
      box-shadow: 2px 2px 0 #181124;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.18s var(--spring-slide), background-color 0.2s ease, color 0.2s ease;
    }

    .hls-chat-minimize-btn i {
      transform: translateY(-2px);
    }

    .hls-chat-minimize-btn:hover {
      background: var(--soft-cyan);
      color: #181124;
      transform: translate(-1px, -1px);
    }

    .divcord-chat-frame {
      width: 100%;
      height: 520px;
      border: 2px solid #885bc4;
      border-radius: 0;
      box-shadow: 4px 4px 0 #2d1d42;
      background: #0e1410;
      display: block;
    }

    /* Fullscreen Chat Toggle Icon (always shown at bottom-right in fullscreen when minimized) */
    .hls-fs-chat-btn {
      display: none;
      position: absolute;
      bottom: 62px;
      right: 16px;
      width: 40px;
      height: 40px;
      background: rgba(24, 17, 36, 0.92);
      color: var(--lavender);
      border: 2px solid #885bc4;
      box-shadow: 3px 3px 0 #2d1d42;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      z-index: 9;
      transition: bottom 0.3s ease, transform 0.18s var(--spring-slide), background-color 0.2s ease, color 0.2s ease;
    }

    .hls-fs-chat-btn:hover {
      background: var(--soft-cyan);
      color: #181124;
      transform: translate(-2px, -2px);
    }

    /* Fullscreen rules for regular video & HLS layout */
    .cozy-player-wrapper:fullscreen,
    .cozy-player-wrapper:-webkit-full-screen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #000;
      margin: 0;
      border: none;
      box-shadow: none;
    }

    .hls-live-layout:fullscreen,
    .hls-live-layout:-webkit-full-screen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex;
      flex-direction: row;
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .hls-live-layout:fullscreen .cozy-player-wrapper.is-hls,
    .hls-live-layout:-webkit-full-screen .cozy-player-wrapper.is-hls {
      flex: 1 1 auto;
      min-width: 0;
      width: 100% !important;
      max-width: 100% !important;
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #000;
      margin: 0;
      border: none;
      box-shadow: none;
    }

    .cozy-player-wrapper:fullscreen .cozy-video-element,
    .cozy-player-wrapper:-webkit-full-screen .cozy-video-element,
    .hls-live-layout:fullscreen .cozy-video-element,
    .hls-live-layout:-webkit-full-screen .cozy-video-element {
      width: 100% !important;
      height: 100% !important;
      max-height: 100% !important;
      aspect-ratio: auto !important;
      object-fit: contain;
      margin-bottom: 0 !important;
    }

    .cozy-player-wrapper:fullscreen .cozy-controls-bar,
    .cozy-player-wrapper:-webkit-full-screen .cozy-controls-bar,
    .hls-live-layout:fullscreen .cozy-controls-bar,
    .hls-live-layout:-webkit-full-screen .cozy-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 6;
      background: rgba(24, 17, 36, 0.94);
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .hls-live-layout:fullscreen .hls-status-pill,
    .hls-live-layout:-webkit-full-screen .hls-status-pill {
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    /* Chat hidden by default in fullscreen; shown only when .fs-chat-open */
    .hls-live-layout:fullscreen .hls-chat-panel,
    .hls-live-layout:-webkit-full-screen .hls-chat-panel {
      display: none;
    }

    .hls-live-layout:fullscreen.fs-chat-open .hls-chat-panel,
    .hls-live-layout:-webkit-full-screen.fs-chat-open .hls-chat-panel {
      display: flex;
      flex-direction: column;
      flex: 0 0 360px;
      width: 360px;
      height: 100vh;
      margin: 0;
      border-left: 2px solid #885bc4;
      background: #0e1410;
      z-index: 8;
    }

    .hls-live-layout:fullscreen.fs-chat-open .divcord-chat-frame,
    .hls-live-layout:-webkit-full-screen.fs-chat-open .divcord-chat-frame {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: 100%;
      border: none;
      box-shadow: none;
    }

    /* Chat icon always appears in bottom right of stream in fullscreen when minimized; hides when chat is open */
    .hls-live-layout:fullscreen .hls-fs-chat-btn,
    .hls-live-layout:-webkit-full-screen .hls-fs-chat-btn {
      display: flex;
    }

    .hls-live-layout:fullscreen.fs-chat-open .hls-fs-chat-btn,
    .hls-live-layout:-webkit-full-screen.fs-chat-open .hls-fs-chat-btn {
      display: none;
    }

    .hls-live-layout:fullscreen .cozy-player-wrapper.is-hls.fs-idle .hls-fs-chat-btn,
    .hls-live-layout:-webkit-full-screen .cozy-player-wrapper.is-hls.fs-idle .hls-fs-chat-btn {
      bottom: 16px;
    }

    @media (max-width: 768px) {
      .hls-live-layout:fullscreen.fs-chat-open,
      .hls-live-layout:-webkit-full-screen.fs-chat-open {
        flex-direction: column;
      }
      .hls-live-layout:fullscreen.fs-chat-open .cozy-player-wrapper.is-hls,
      .hls-live-layout:-webkit-full-screen.fs-chat-open .cozy-player-wrapper.is-hls {
        flex: 0 0 44vh;
        height: 44vh !important;
        max-height: 44vh !important;
      }
      .hls-live-layout:fullscreen.fs-chat-open .hls-chat-panel,
      .hls-live-layout:-webkit-full-screen.fs-chat-open .hls-chat-panel {
        flex: 1 1 auto;
        width: 100%;
        height: 56vh;
        border-left: none;
        border-top: 2px solid #885bc4;
      }
    }

    /* Fullscreen Auto-Hide UI when idle */
    .cozy-player-wrapper.fs-idle,
    .cozy-player-wrapper.fs-idle .cozy-video-element {
      cursor: none;
    }

    .cozy-player-wrapper.fs-idle .cozy-controls-bar,
    .cozy-player-wrapper.fs-idle .hls-status-pill,
    .cozy-player-wrapper.fs-idle .player-center-play {
      opacity: 0 !important;
      visibility: hidden;
      pointer-events: none;
    }

    .hls-status-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--live-red);
      color: #ffffff;
      border: 1.5px solid #ffffff;
      padding: 3px 9px;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 4;
      pointer-events: none;
    }

    .hls-status-pill.is-vod {
      background: rgba(24, 17, 36, 0.9);
      border-color: var(--lavender);
    }

    .hls-status-pill.is-vod .hls-dot {
      animation: none;
      background: var(--soft-cyan);
    }

    .hls-error-overlay {
      position: absolute;
      inset: 0 0 46px 0;
      background: rgba(14, 10, 22, 0.9);
      color: #ffffff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      z-index: 5;
    }

    .hls-error-overlay.active {
      display: flex;
    }

    .hls-error-msg {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--lavender);
    }

    .hls-retry-btn {
      background: var(--live-red);
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .hls-retry-btn:hover {
      background: var(--soft-cyan);
      color: #181124;
      border-color: var(--border-crisp);
      transform: translate(-1px, -1px);
    }

    .player-center-play {
      position: absolute;
      top: calc(50% - 20px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: rgba(37, 20, 58, 0.9);
      border: 2px solid var(--lavender);
      color: var(--lavender);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .cozy-player-wrapper.playing .player-center-play {
      opacity: 0;
      pointer-events: none;
    }

    .cozy-controls-bar {
      background: #25143a;
      border-top: 2px solid var(--border-crisp);
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(227, 215, 255, 0.25);
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      pointer-events: none;
    }

    .progress-fill.is-live {
      background: var(--live-red);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cozy-ctrl-btn {
      background: transparent;
      border: none;
      color: var(--lavender);
      font-size: 0.92rem;
      cursor: pointer;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hls-go-live-btn {
      display: none;
      background: var(--live-red);
      color: #ffffff;
      border: 1px solid #ffffff;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      padding: 2px 7px;
      cursor: pointer;
    }

    .hls-go-live-btn.visible {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .time-readout {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--lavender);
      letter-spacing: 0.5px;
    }

    /* Voting pill */
    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--border-crisp);
      padding-top: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .vote-pill {
      display: inline-flex;
      align-items: center;
      background: var(--vote-bg);
      border: 2px solid var(--border-crisp);
    }

    .vote-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 800;
    }

    .vote-count {
      font-size: 0.88rem;
      font-weight: 800;
      min-width: 32px;
      text-align: center;
      color: var(--text-main);
      user-select: none;
    }

    .vote-btn.up.active {
      background-color: var(--green);
      color: #1b380b;
    }

    .vote-btn.down.active {
      background-color: var(--coral);
      color: #ffffff;
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 20, 16, 0.92);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-box {
      position: relative;
      background: var(--card-bg);
      border: 4px solid var(--border-crisp);
      outline: 3px solid var(--card-bg);
      max-width: 92vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close-btn {
      position: absolute;
      top: -18px;
      right: -18px;
      background: var(--coral);
      color: #ffffff;
      border: 2px solid var(--border-crisp);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      z-index: 5;
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(24, 17, 36, 0.88);
      color: #ffffff;
      border: 2px solid var(--lavender);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      cursor: pointer;
      z-index: 5;
    }

    .lightbox-nav-btn:hover {
      background: var(--soft-cyan);
      color: #181124;
    }

    .lightbox-nav-btn.prev { left: 12px; }
    .lightbox-nav-btn.next { right: 12px; }

    .lightbox-counter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 17, 36, 0.88);
      color: #ffffff;
      border: 1.5px solid var(--lavender);
      padding: 3px 12px;
      font-size: 0.78rem;
      font-weight: 800;
      display: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Top-Right Dark Mode Toggle -->
  <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="toggleTheme()">
    <i class="fa-solid fa-moon"></i>
  </button>

  <div class="container">
    
    <!-- Profile Card (Cover: cover.png, Profile: profile.png) -->
    <div class="pop-shell">
      <section class="slide-card">
        <div class="banner">
          <a href="http://wiki.prantik.qd.je" class="banner-wiki-btn" aria-label="Visit Wiki" title="Visit Wiki">
            <i class="fa-solid fa-globe"></i>
          </a>
        </div>
        
        <div class="profile-details">

    function initDivcordChat(frame) {
      if (!frame || typeof window.Divcord === 'undefined') return;
      try {
        const bridge = window.Divcord.connect(frame);
        bridge.ready.then(() => {
          bridge.setCSS(DIVCORD_DARK_THEME_CSS, { reset: false });
        });
      } catch (e) {
        console.warn('Divcord embed init error:', e);
      }

    /* ================= MEMBER ACCESS HELPERS ================= */
    function parseMemberCodeList(rawVal) {
      const codes = new Set();
      if (!rawVal) return codes;
      try {
        const parsed = typeof rawVal === 'string' ? JSON.parse(rawVal) : rawVal;
        if (Array.isArray(parsed)) {
          parsed.forEach(item => {
            const c = typeof item === 'string' ? item : (item && item.code ? item.code : '');
            const clean = String(c).trim().toUpperCase();
            if (clean.length === 16) codes.add(clean);
          });
        }
      } catch (e) {
        console.warn('Failed to parse member codes:', e);
      }
      return codes;
    }

    async function fetchValidMemberCodes() {
      if (!supabaseClient) return validMemberCodes;
      try {
        const { data } = await supabaseClient
          .from('site_settings')
          .select('value')
          .eq('key', 'member_codes')
          .maybeSingle();

        if (data && data.value) {
          validMemberCodes = parseMemberCodeList(data.value);
        } else {
          validMemberCodes = new Set();
        }
      } catch (e) {
        console.warn('Could not fetch member codes:', e);
      }
      return validMemberCodes;
    }

    function isCurrentVisitorMember() {
      const saved = (localStorage.getItem(MEMBER_STORAGE_KEY) || '').trim().toUpperCase();
      return saved.length === 16 && validMemberCodes.has(saved);
    }

    async function handleMemberUnlock(event, formEl) {
      event.preventDefault();
      const input = formEl.querySelector('.members-code-input');
      const errorEl = formEl.parentElement.querySelector('.members-code-error');
      const submitBtn = formEl.querySelector('.members-unlock-btn');
      const entered = (input.value || '').replace(/\s+/g, '').toUpperCase();

      if (entered.length !== 16) {
        errorEl.textContent = 'Please enter a valid 16-character member code.';
        errorEl.style.display = 'block';
        return;
      }

      const origText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking...';
      errorEl.style.display = 'none';

      await fetchValidMemberCodes();

      submitBtn.disabled = false;
      submitBtn.textContent = origText;

      if (validMemberCodes.has(entered)) {
        localStorage.setItem(MEMBER_STORAGE_KEY, entered);
        renderFeedPosts();
      } else {
        errorEl.textContent = 'Invalid or revoked 16-character code.';
        errorEl.style.display = 'block';
        input.focus();
      }
    }

    /* ================= FULLSCREEN UI AUTO-HIDE ================= */
    function setupFullscreenAutoHide(wrapper, fsTarget, isInteractingFn) {
      let idleTimer = null;
      let lastMoveX = null;
      let lastMoveY = null;
      let wokeFromHiddenTouch = false;
      const IDLE_DELAY_MS = 2500;

      function isThisFullscreen() {
        const activeEl = document.fullscreenElement || document.webkitFullscreenElement;
        return activeEl === fsTarget || activeEl === wrapper;
      }

      function clearIdleTimer() {
        if (idleTimer) {
          clearTimeout(idleTimer);
          idleTimer = null;
        }
      }

      function scheduleIdleHide() {
        clearIdleTimer();
        if (!isThisFullscreen()) return;
        idleTimer = setTimeout(() => {
          if (!isThisFullscreen()) return;
          if (isInteractingFn && isInteractingFn()) {
            scheduleIdleHide();
            return;
          }
          wrapper.classList.add('fs-idle');
        }, IDLE_DELAY_MS);
      }

      function showUIAndResetTimer() {
        if (!isThisFullscreen()) {
          wrapper.classList.remove('fs-idle');
          clearIdleTimer();
          return;
        }
        wrapper.classList.remove('fs-idle');
        scheduleIdleHide();
      }

      wrapper.addEventListener('mousemove', (e) => {
        if (!isThisFullscreen()) return;
        if (lastMoveX === e.clientX && lastMoveY === e.clientY) return;
        lastMoveX = e.clientX;
        lastMoveY = e.clientY;
        showUIAndResetTimer();
      });

      wrapper.addEventListener('mousedown', () => {
        if (isThisFullscreen()) showUIAndResetTimer();
      });

      wrapper.addEventListener('touchstart', () => {
        if (!isThisFullscreen()) return;
        if (wrapper.classList.contains('fs-idle')) {
          wokeFromHiddenTouch = true;
          setTimeout(() => { wokeFromHiddenTouch = false; }, 450);
        }
        showUIAndResetTimer();
      }, { passive: true });

      wrapper.addEventListener('click', () => {
        if (isThisFullscreen()) showUIAndResetTimer();
      });

      document.addEventListener('keydown', () => {
        if (isThisFullscreen()) showUIAndResetTimer();
      });

      function onFsChange() {
        lastMoveX = null;
        lastMoveY = null;
        if (isThisFullscreen()) {
          showUIAndResetTimer();
        } else {
          wrapper.classList.remove('fs-idle');
          if (fsTarget !== wrapper) {
            fsTarget.classList.remove('fs-chat-open');
          }
          clearIdleTimer();
        }
      }

      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('webkitfullscreenchange', onFsChange);

      return {
        shouldIgnoreVideoClick() {
          return wokeFromHiddenTouch;
        }
      };
    }

    /* ================= THEME TOGGLE ================= */
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');

      const btn = document.getElementById('themeToggleBtn');
      btn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.body.classList.add('dark-mode');
        updateThemeIcon(true);
      } else {
        updateThemeIcon(false);

    })();

    /* ================= LAST.FM STATUS ================= */
    async function initLastFm() {
      let username = CONFIG_LASTFM_USER || localStorage.getItem('LASTFM_USER') || '';
      let apiKey   = CONFIG_LASTFM_KEY  || localStorage.getItem('LASTFM_KEY')  || '';

      if ((!username || !apiKey) && supabaseClient) {
        try {
          const { data } = await supabaseClient.from('site_settings').select('*');
          if (data) {
            data.forEach(row => {
              if (row.key === 'lastfm_user') username = row.value;
              if (row.key === 'lastfm_key') apiKey = row.value;
            });
          }
        } catch (e) {}
      }

      if (!username || !apiKey) return;

      async function fetchNowPlaying() {
        try {
          const endpoint = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(username)}&api_key=${encodeURIComponent(apiKey)}&format=json&limit=1`;
          const res = await fetch(endpoint);
          const data = await res.json();

          if (!data || !data.recenttracks || !data.recenttracks.track || data.recenttracks.track.length === 0) {
            return;
          }

          const track = data.recenttracks.track[0];
          const isPlaying = track['@attr'] && track['@attr'].nowplaying === 'true';

          const bubbleContainer = document.getElementById('musicBubbleContainer');
          const titleEl = document.getElementById('musicTitle');
          const artistEl = document.getElementById('musicArtist');
          const linkEl = document.getElementById('musicBubbleLink');

          titleEl.textContent = track.name;
          artistEl.textContent = typeof track.artist === 'object' ? track.artist['#text'] : track.artist;
          linkEl.href = track.url || 'https://www.last.fm';

          if (isPlaying) {
            bubbleContainer.classList.remove('paused');
          } else {
            bubbleContainer.classList.add('paused');
          }

          bubbleContainer.style.display = 'flex';
        } catch (err) {
          console.warn('Last.fm fetch error:', err);
        }
      }

      fetchNowPlaying();
      setInterval(fetchNowPlaying, 20000);
    }

    /* ================= CONTENT & IMAGE PARSING ================= */
    function parsePostContent(post) {
      let text = post.content || '';
      let hasMembersPrefix = false;
      let hasMdPrefix = false;

      let changed = true;
      while (changed) {
        changed = false;
        if (text.startsWith('<!--members-->')) {
          hasMembersPrefix = true;
          text = text.replace(/^<!--members-->\r?\n?/, '');
          changed = true;
        }
        if (text.startsWith('<!--md-->')) {
          hasMdPrefix = true;
          text = text.replace(/^<!--md-->\r?\n?/, '');
          changed = true;
        }
      }

      return {
        isMembersOnly: Boolean(post.is_members_only) || hasMembersPrefix,
        isMarkdown: Boolean(post.is_markdown) || hasMdPrefix,
        cleanText: text
      };
    }

    function parseImageUrls(imageField) {
      if (!imageField) return [];
      if (Array.isArray(imageField)) {
        return imageField.map(u => String(u).trim()).filter(Boolean);
      }
      if (typeof imageField === 'string') {
        const trimmed = imageField.trim();
        if (!trimmed) return [];
        if (trimmed.startsWith('[')) {
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) {
              return parsed.map(u => String(u).trim()).filter(Boolean);
            }
          } catch (e) {}
        }
        return [trimmed];
      }
      return [];
    }

    function renderMarkdown(mdText) {
      if (window.marked && window.DOMPurify) {
        marked.setOptions({
          gfm: true,
          breaks: true
        });
        const rawHtml = marked.parse(mdText || '');
        return DOMPurify.sanitize(rawHtml);
      }
      return escapeHTML(mdText || '');
    }

    /* ================= FEED LOADER & RENDERER ================= */
    async function loadPosts() {
      const feedList = document.getElementById('feedList');
      if (!supabaseClient) {
        setProfileLiveStatus(false);
        feedList.innerHTML = `
          <div class="pop-shell">
            <div class="slide-card" style="padding: 24px; text-align: center;">
              <h3>Welcome to prantik's corner.</h3>
              <p style="margin-top: 6px; color: var(--text-muted); font-size: 0.9rem;">
                No posts published yet.
              </p>
            </div>
          </div>
        `;
        return;
      }

      const [postsRes] = await Promise.all([
        supabaseClient.from('posts').select('*').order('created_at', { ascending: false }),
        fetchValidMemberCodes()
      ]);

      const { data, error } = postsRes;

      if (error) {
        console.error('Supabase posts load error:', error);
      }

      if (error || !data || data.length === 0) {
        setProfileLiveStatus(false);
        feedList.innerHTML = `
          <div class="pop-shell">
            <div class="slide-card" style="padding: 24px; text-align: center;">
              <h3>Quiet for now.</h3>
              <p style="margin-top: 6px; color: var(--text-muted); font-size: 0.9rem;">
                Check back soon for fresh thoughts.
              </p>
            </div>
          </div>
        `;
        return;
      }

      cachedPosts = data;
      renderFeedPosts();
    }

    function renderFeedPosts() {
      const feedList = document.getElementById('feedList');
      const memberUnlocked = isCurrentVisitorMember();

    /* ================= INSTAGRAM CAROUSEL CONTROLLER ================= */
    function setupCarousel(carousel) {
      const track = carousel.querySelector('.carousel-track');
      const slides = carousel.querySelectorAll('.carousel-slide');
      const prevBtn = carousel.querySelector('.carousel-nav.prev');
      const nextBtn = carousel.querySelector('.carousel-nav.next');
      const counter = carousel.querySelector('.carousel-counter');
      const dots = carousel.querySelectorAll('.carousel-dot');
      const expandBtn = carousel.querySelector('.carousel-expand-btn');
      const postId = carousel.getAttribute('data-post-id');
      const total = slides.length;
      let currentIdx = 0;
      let scrollRaf = null;

      function updateUI(idx) {
        currentIdx = Math.max(0, Math.min(total - 1, idx));
        counter.textContent = `${currentIdx + 1} / ${total}`;
        prevBtn.style.display = currentIdx === 0 ? 'none' : 'flex';
        nextBtn.style.display = currentIdx === total - 1 ? 'none' : 'flex';
        dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIdx));
      }

      function goToSlide(idx) {
        const target = Math.max(0, Math.min(total - 1, idx));
        track.scrollTo({
          left: target * track.clientWidth,
          behavior: 'smooth'
        });
        updateUI(target);
      }

      prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToSlide(currentIdx - 1);
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        goToSlide(currentIdx + 1);
      });

      dots.forEach(dot => {
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(dot.getAttribute('data-dot-index'), 10);
          goToSlide(idx);
        });
      });

      track.addEventListener('scroll', () => {
        if (scrollRaf) return;
        scrollRaf = requestAnimationFrame(() => {
          scrollRaf = null;
          if (track.clientWidth > 0) {
            const idx = Math.round(track.scrollLeft / track.clientWidth);
            if (idx !== currentIdx) updateUI(idx);
          }
        });
      }, { passive: true });

      slides.forEach((slide, idx) => {
        const img = slide.querySelector('img');
        if (img) {
          img.addEventListener('click', () => {
            openLightbox(postImagesMap[postId] || [img.src], idx);
          });
        }
      });

      if (expandBtn) {
        expandBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(postImagesMap[postId] || [], currentIdx);
        });
      }
    }

    /* ================= VOTING ================= */
    async function handleDbVote(postId, direction, btn) {
      if (!supabaseClient) return;
      const card = btn.closest('article');
      const countEl = card.querySelector('.vote-count');
      const upBtn = card.querySelector('.vote-btn.up');
      const downBtn = card.querySelector('.vote-btn.down');

      let currentVoted = card.getAttribute('data-voted') || 'none';
      let currentVotes = parseInt(card.getAttribute('data-votes'), 10);
      let diff = 0;

      if (direction === 1) {
        if (currentVoted === 'up') {
          currentVoted = 'none';
          diff = -1;
          upBtn.classList.remove('active');
        } else {
          diff = currentVoted === 'down' ? 2 : 1;
          currentVoted = 'up';
          upBtn.classList.add('active');
          downBtn.classList.remove('active');
        }
      } else {
        if (currentVoted === 'down') {
          currentVoted = 'none';
          diff = 1;
          downBtn.classList.remove('active');
        } else {
          diff = currentVoted === 'up' ? -2 : -1;
          currentVoted = 'down';
          downBtn.classList.add('active');
          upBtn.classList.remove('active');
        }
      }

      card.setAttribute('data-voted', currentVoted);
      const newTotal = currentVotes + diff;
      card.setAttribute('data-votes', newTotal);
      countEl.textContent = newTotal;

      await supabaseClient.from('posts').update({ votes: newTotal }).eq('id', postId);
    }

    /* ================= HLS LIVE VIDEO PLAYER ================= */
    function setupHlsPlayer(hlsLayout) {
      const wrapper = hlsLayout.querySelector('.cozy-player-wrapper.is-hls');
      const chatFrame = hlsLayout.querySelector('.divcord-chat-frame');
      const chatToggleBtn = hlsLayout.querySelector('.hls-fs-chat-btn');
      const chatMinimizeBtn = hlsLayout.querySelector('.hls-chat-minimize-btn');
      const hlsUrl = wrapper.getAttribute('data-hls-url');
      const video = wrapper.querySelector('video');
      const playBtn = wrapper.querySelector('.btn-play-toggle');
      const centerPlay = wrapper.querySelector('.player-center-play');
      const muteBtn = wrapper.querySelector('.btn-mute-toggle');
      const fsBtn = wrapper.querySelector('.btn-fs-toggle');
      const track = wrapper.querySelector('.progress-track');
      const fill = wrapper.querySelector('.progress-fill');
      const timeText = wrapper.querySelector('.time-readout');
      const statusPill = wrapper.querySelector('.hls-status-pill');
      const statusText = wrapper.querySelector('.hls-status-text');
      const goLiveBtn = wrapper.querySelector('.hls-go-live-btn');
      const errorOverlay = wrapper.querySelector('.hls-error-overlay');
      const errorMsg = wrapper.querySelector('.hls-error-msg');
      const retryBtn = wrapper.querySelector('.hls-retry-btn');
      const controlsBar = wrapper.querySelector('.cozy-controls-bar');

      let hls = null;
      let isLiveStream = true;
      let mediaRecoveryAttempts = 0;
      let networkRecoveryAttempts = 0;
      let isScrubbing = false;

      initDivcordChat(chatFrame);

      const fsAutoHide = setupFullscreenAutoHide(wrapper, hlsLayout, () => isScrubbing);

      controlsBar.addEventListener('click', (e) => e.stopPropagation());
      errorOverlay.addEventListener('click', (e) => e.stopPropagation());

      if (chatToggleBtn) {
        chatToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          hlsLayout.classList.add('fs-chat-open');
        });
      }

      if (chatMinimizeBtn) {
        chatMinimizeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          hlsLayout.classList.remove('fs-chat-open');
        });
      }

      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function showStreamError(message) {
        errorMsg.textContent = message || 'Stream is offline or unreachable.';
        errorOverlay.classList.add('active');
      }

      function hideStreamError() {
        errorOverlay.classList.remove('active');
      }

      function setLiveMode(live) {
        isLiveStream = live;
        if (live) {
          statusPill.classList.remove('is-vod');
          statusText.textContent = 'LIVE';
          fill.classList.add('is-live');
          fill.style.width = '100%';
          timeText.textContent = '● LIVE';
        } else {
          statusPill.classList.add('is-vod');
          statusText.textContent = 'HLS';
          fill.classList.remove('is-live');
          goLiveBtn.classList.remove('visible');
        }
      }

      function getLiveEdge() {
        if (hls && typeof hls.liveSyncPosition === 'number' && isFinite(hls.liveSyncPosition)) {
          return hls.liveSyncPosition;
        }
        if (video.seekable && video.seekable.length > 0) {
          return video.seekable.end(video.seekable.length - 1);
        }
        return null;
      }

      function jumpToLiveEdge() {
        const edge = getLiveEdge();
        if (edge !== null && isFinite(edge)) {
          video.currentTime = edge;
        }
        if (video.paused) {
          video.play().catch(() => {});
        }
        goLiveBtn.classList.remove('visible');
      }

      function initHlsSource() {
        hideStreamError();
        mediaRecoveryAttempts = 0;
        networkRecoveryAttempts = 0;

        if (hls) {
          hls.destroy();
          hls = null;
        }

        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            lowLatencyMode: true,
            backBufferLength: 60,
            maxBufferLength: 12
          });

          hls.loadSource(hlsUrl);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            hideStreamError();
          });

          hls.on(Hls.Events.LEVEL_LOADED, (event, data) => {
            if (data && data.details) {
              setLiveMode(Boolean(data.details.live));
            }
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (!data.fatal) return;

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR && networkRecoveryAttempts < 2) {
              networkRecoveryAttempts++;
              setTimeout(() => {
                if (hls) hls.startLoad();
              }, 1000);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRecoveryAttempts < 2) {
              mediaRecoveryAttempts++;
              hls.recoverMediaError();
            } else {
              showStreamError('Stream is offline or unreachable.');
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = hlsUrl;
          video.addEventListener('loadedmetadata', () => {
            setLiveMode(!isFinite(video.duration));
          });
          video.addEventListener('error', () => {
            showStreamError('Stream is offline or unreachable.');
          });
        } else {
          showStreamError('HLS playback is not supported in this browser.');
        }
      }

      function updatePlayState(isPlaying) {
        if (isPlaying) {
          wrapper.classList.add('playing');
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        } else {
          wrapper.classList.remove('playing');
          playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }
      }

      function togglePlay() {
        if (video.paused || video.ended) {
          if (isLiveStream) {
            const edge = getLiveEdge();
            if (edge !== null && Math.abs(edge - video.currentTime) > 5) {
              video.currentTime = edge;
            }
          }
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      }

      video.addEventListener('loadedmetadata', () => {
        if (video.videoWidth && video.videoHeight) {
          video.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
        }
      });

      playBtn.addEventListener('click', togglePlay);
      centerPlay.addEventListener('click', togglePlay);
      video.addEventListener('click', () => {
        if (fsAutoHide.shouldIgnoreVideoClick()) return;
        togglePlay();
      });
      goLiveBtn.addEventListener('click', jumpToLiveEdge);
      retryBtn.addEventListener('click', () => {
        initHlsSource();
        video.play().catch(() => {});
      });

      video.addEventListener('play', () => updatePlayState(true));
      video.addEventListener('pause', () => {
        updatePlayState(false);
        if (isLiveStream) goLiveBtn.classList.add('visible');
      });
      video.addEventListener('ended', () => {
        updatePlayState(false);
        if (!isLiveStream) fill.style.width = '0%';
      });

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted
          ? '<i class="fa-solid fa-volume-xmark"></i>'
          : '<i class="fa-solid fa-volume-high"></i>';
      });

      video.addEventListener('timeupdate', () => {
        if (isLiveStream) {
          const edge = getLiveEdge();
          const behind = edge !== null ? Math.max(0, edge - video.currentTime) : 0;
          if (behind > 6 || video.paused) {
            goLiveBtn.classList.add('visible');
            timeText.textContent = `-${formatTime(behind)} BEHIND`;
          } else {
            goLiveBtn.classList.remove('visible');
            timeText.textContent = '● LIVE';
          }

          if (video.seekable && video.seekable.length > 0) {
            const start = video.seekable.start(0);
            const end = video.seekable.end(video.seekable.length - 1);
            const span = end - start;
            const pct = span > 0 ? Math.max(0, Math.min(100, ((video.currentTime - start) / span) * 100)) : 100;
            fill.style.width = `${pct}%`;
          } else {
            fill.style.width = '100%';
          }
        } else if (video.duration && isFinite(video.duration)) {
          const pct = (video.currentTime / video.duration) * 100;
          fill.style.width = `${pct}%`;
          timeText.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }
      });

      function handleSeek(e) {
        const rect = track.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));

        if (isLiveStream) {
          if (video.seekable && video.seekable.length > 0) {
            const start = video.seekable.start(0);
            const end = video.seekable.end(video.seekable.length - 1);
            video.currentTime = start + pos * (end - start);
            fill.style.width = `${pos * 100}%`;
          }
        } else if (video.duration && isFinite(video.duration)) {
          video.currentTime = pos * video.duration;
          fill.style.width = `${pos * 100}%`;
        }
      }

      track.addEventListener('mousedown', (e) => {
        isScrubbing = true;
        handleSeek(e);
      });
      window.addEventListener('mousemove', (e) => {
        if (isScrubbing) handleSeek(e);
      });
      window.addEventListener('mouseup', () => {
        isScrubbing = false;
      });

      fsBtn.addEventListener('click', () => {
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        if (!fsEl) {
          if (hlsLayout.requestFullscreen) {
            hlsLayout.requestFullscreen();
          } else if (hlsLayout.webkitRequestFullscreen) {
            hlsLayout.webkitRequestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      });

      function updateFsState() {
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        const isFs = fsEl === hlsLayout;
        fsBtn.innerHTML = isFs
          ? '<i class="fa-solid fa-compress"></i>'
          : '<i class="fa-solid fa-expand"></i>';
      }

      document.addEventListener('fullscreenchange', updateFsState);
      document.addEventListener('webkitfullscreenchange', updateFsState);

      initHlsSource();
    }

    /* ================= CUSTOM VIDEO PLAYER ================= */
    function setupVideoPlayer(wrapper) {
      const video = wrapper.querySelector('video');
      const playBtn = wrapper.querySelector('.btn-play-toggle');
      const centerPlay = wrapper.querySelector('.player-center-play');
      const muteBtn = wrapper.querySelector('.btn-mute-toggle');
      const fsBtn = wrapper.querySelector('.btn-fs-toggle');
      const track = wrapper.querySelector('.progress-track');
      const fill = wrapper.querySelector('.progress-fill');
      const timeText = wrapper.querySelector('.time-readout');
      const controlsBar = wrapper.querySelector('.cozy-controls-bar');

      let isScrubbing = false;
      const fsAutoHide = setupFullscreenAutoHide(wrapper, wrapper, () => isScrubbing);

      controlsBar.addEventListener('click', (e) => e.stopPropagation());

      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function updatePlayState(isPlaying) {
        if (isPlaying) {
          wrapper.classList.add('playing');
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        } else {
          wrapper.classList.remove('playing');
          playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }
      }

      function togglePlay() {
        if (video.paused || video.ended) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      }

      playBtn.addEventListener('click', togglePlay);
      centerPlay.addEventListener('click', togglePlay);
      video.addEventListener('click', () => {
        if (fsAutoHide.shouldIgnoreVideoClick()) return;
        togglePlay();
      });

      video.addEventListener('play', () => updatePlayState(true));
      video.addEventListener('pause', () => updatePlayState(false));
      video.addEventListener('ended', () => {
        updatePlayState(false);
        fill.style.width = '0%';
      });

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
      });

      video.addEventListener('timeupdate', () => {
        if (video.duration) {
          const pct = (video.currentTime / video.duration) * 100;
          fill.style.width = `${pct}%`;
          timeText.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }
      });

      video.addEventListener('loadedmetadata', () => {
        timeText.textContent = `0:00 / ${formatTime(video.duration)}`;
      });

      function handleSeek(e) {
        if (!video.duration) return;
        const rect = track.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        video.currentTime = pos * video.duration;
        fill.style.width = `${pos * 100}%`;
      }

      track.addEventListener('mousedown', (e) => {
        isScrubbing = true;
        handleSeek(e);
      });
      window.addEventListener('mousemove', (e) => {
        if (isScrubbing) handleSeek(e);
      });
      window.addEventListener('mouseup', () => {
        isScrubbing = false;
      });

      fsBtn.addEventListener('click', () => {
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        if (!fsEl) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      });

      function updateFsIcon() {
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        fsBtn.innerHTML = fsEl === wrapper
          ? '<i class="fa-solid fa-compress"></i>'
          : '<i class="fa-solid fa-expand"></i>';
      }

      document.addEventListener('fullscreenchange', updateFsIcon);
      document.addEventListener('webkitfullscreenchange', updateFsIcon);
    }

    /* ================= LIGHTBOX (SINGLE & SLIDE) ================= */
    let lightboxImages = [];
    let lightboxIndex = 0;

    function openLightbox(srcOrList, startIndex = 0) {
      lightboxImages = Array.isArray(srcOrList) ? srcOrList : [srcOrList];
      if (!lightboxImages.length) return;
      lightboxIndex = Math.max(0, Math.min(lightboxImages.length - 1, startIndex));
      renderLightboxSlide();
      document.getElementById('lightboxModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function renderLightboxSlide() {
      const img = document.getElementById('lightboxTargetImg');
      const prevBtn = document.getElementById('lightboxPrev');
      const nextBtn = document.getElementById('lightboxNext');
      const counter = document.getElementById('lightboxCounter');

      img.src = lightboxImages[lightboxIndex];

      if (lightboxImages.length > 1) {
        counter.textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
        counter.style.display = 'block';
        prevBtn.style.display = lightboxIndex > 0 ? 'flex' : 'none';
        nextBtn.style.display = lightboxIndex < lightboxImages.length - 1 ? 'flex' : 'none';
      } else {
        counter.style.display = 'none';
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      }
    }

    function stepLightbox(delta) {
      const next = lightboxIndex + delta;
      if (next >= 0 && next < lightboxImages.length) {
        lightboxIndex = next;
        renderLightboxSlide();
      }
    }

    function closeLightbox(event) {
      if (!event || event.target.id === 'lightboxModal') {
        document.getElementById('lightboxModal').classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('lightboxModal');
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox(null);
      if (e.key === 'ArrowLeft') stepLightbox(-1);
      if (e.key === 'ArrowRight') stepLightbox(1);
    });

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    loadPosts();
    initLastFm();
  </script>
</body>
