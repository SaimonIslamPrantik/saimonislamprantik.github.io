<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>prantik</title>
  
  <!-- Google Fonts: Darumadrop One & Hanken Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6.5.1 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --lavender: #e3d7ff;
      --green: #95e06c;
      --coral: #ff5a5f;
      --deep-purple: #4c2c72;
      --soft-cyan: #7ee8fa;

      /* Light Theme Base */
      --bg-page: #f0f7ee;
      --grid-line-color: rgba(149, 224, 108, 0.28);
      --card-bg: #ffffff;
      --text-main: #4c2c72;
      --text-muted: #745b91;
      --border-crisp: #4c2c72;

      /* Placeholder Behind Pop */
      --placeholder-bg: #e3d7ff;
      --placeholder-border: rgba(76, 44, 114, 0.35);
      --placeholder-stamp: rgba(76, 44, 114, 0.4);

      /* Glow & Ambient */
      --glow-top: rgba(227, 215, 255, 0.8);
      --glow-mid: rgba(126, 232, 250, 0.3);
      --vote-bg: #faf8fd;

      --spring-slide: cubic-bezier(0.2, 0.9, 0.3, 1.25);
    }

    /* Dark Mode Overrides */
    body.dark-mode {
      --bg-page: #0e1410;
      --grid-line-color: rgba(149, 224, 108, 0.14);
      --card-bg: #181124;
      --text-main: #f0eaff;
      --text-muted: #b49fcf;
      --border-crisp: #885bc4;

      --placeholder-bg: #2d1d42;
      --placeholder-border: rgba(227, 215, 255, 0.3);
      --placeholder-stamp: rgba(227, 215, 255, 0.35);

      --glow-top: rgba(136, 91, 196, 0.35);
      --glow-mid: rgba(126, 232, 250, 0.12);
      --vote-bg: #221733;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    /* Bubble exemptions so it stays rounded */
    .music-bubble,
    .music-bubble-tail,
    .music-bubble-dot,
    .sound-bar {
      border-radius: 9999px !important;
    }

    body, button, input, textarea, select {
      font-family: 'Hanken Grotesk', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      background-image: 
        linear-gradient(to right, var(--grid-line-color) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, var(--grid-line-color) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 18px 90px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body::before {
      content: "";
      position: fixed;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 94vw;
      max-width: 1300px;
      height: 520px;
      background: radial-gradient(
        ellipse at top, 
        var(--glow-top) 0%, 
        var(--glow-mid) 45%, 
        transparent 75%
      );
      pointer-events: none;
      z-index: 0;
      filter: blur(32px);
      transition: background 0.3s ease;
    }

    /* Top-Right Theme Toggle Button */
    .theme-toggle-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 3px 3px 0 var(--border-crisp);
      transition: transform 0.18s var(--spring-slide), background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle-btn:hover {
      transform: translate(-2px, -2px);
      background: var(--soft-cyan);
      color: #181124;
    }

    .container {
      width: min(96%, 1160px);
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    .pop-shell {
      position: relative;
      background-color: var(--placeholder-bg);
      border: 2px dashed var(--placeholder-border);
      margin-top: 10px;
      margin-left: 10px;
      transition: background-color 0.25s ease;
    }

    .pop-shell::after {
      content: "✦ PLACEHOLDER";
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--placeholder-stamp);
      pointer-events: none;
      z-index: 0;
    }

    .slide-card {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      width: 100%;
      z-index: 1;
      transition: transform 0.22s var(--spring-slide), box-shadow 0.22s ease, background-color 0.25s ease, border-color 0.25s ease;
      cursor: default;
    }

    .pop-shell:hover .slide-card,
    .pop-shell:active .slide-card,
    .pop-shell:focus-within .slide-card {
      transform: translate(-10px, -10px);
      box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.25);
    }

    /* Cover: cover.png */
    .banner {
      height: 155px;
      width: 100%;
      background: url('cover.png') center center/cover no-repeat, linear-gradient(135deg, var(--lavender) 0%, var(--soft-cyan) 60%, #b8f0f9 100%);
      position: relative;
      border-bottom: 2px solid var(--border-crisp);
    }

    .profile-details {
      padding: 0 28px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 24px;
      position: relative;
    }

    /* Avatar: profile.png */
    .avatar-wrapper {
      position: relative;
      margin-top: -55px;
      flex-shrink: 0;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border: 4px solid var(--card-bg);
      outline: 2px solid var(--border-crisp);
      background: var(--lavender);
      object-fit: cover;
      display: block;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, border-color 0.25s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    /* ================= LIVE LAST.FM STATUS BUBBLE ================= */
    .music-bubble-container {
      position: absolute;
      top: -62px;
      left: -10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      animation: floatBubble 3s ease-in-out infinite alternate;
      pointer-events: auto;
    }

    .music-bubble {
      background: #25143a;
      border: 2px solid var(--border-crisp);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      max-width: 260px;
      cursor: pointer;
      transition: transform 0.2s var(--spring-slide), background-color 0.2s ease;
    }

    .music-bubble:hover {
      transform: scale(1.05);
      background: #381f57;
    }

    .equalizer-bars {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
      flex-shrink: 0;
    }

    .sound-bar {
      width: 3px;
      background-color: #ffffff;
      animation: bounceBar 1.2s ease-in-out infinite alternate;
    }

    .sound-bar:nth-child(1) { height: 7px; animation-delay: 0.1s; }
    .sound-bar:nth-child(2) { height: 15px; animation-delay: 0.3s; }
    .sound-bar:nth-child(3) { height: 10px; animation-delay: 0.5s; }

    .music-bubble-container.paused .sound-bar {
      animation: none;
      height: 6px;
    }

    @keyframes bounceBar {
      0% { height: 4px; }
      100% { height: 15px; }
    }

    @keyframes floatBubble {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-4px); }
    }

    .music-bubble-info {
      display: flex;
      flex-direction: column;
      line-height: 1.22;
      overflow: hidden;
      white-space: nowrap;
    }

    .music-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .music-artist {
      font-size: 0.72rem;
      color: #d1b8ff;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .music-bubble-tail {
      width: 10px;
      height: 10px;
      background: #25143a;
      border: 1.5px solid var(--border-crisp);
      margin-left: 22px;
      margin-top: -3px;
    }

    .music-bubble-dot {
      width: 5px;
      height: 5px;
      background: #25143a;
      border: 1px solid var(--border-crisp);
      margin-left: 28px;
      margin-top: 2px;
    }

    /* Mobile Responsive Rule for the Bubble */
    @media (max-width: 600px) {
      .music-bubble-container {
        top: -56px;
        left: -4px;
      }
      .music-bubble {
        max-width: 215px;
        padding: 6px 12px;
        gap: 7px;
      }
      .music-title {
        font-size: 0.76rem;
        max-width: 140px;
      }
      .music-artist {
        font-size: 0.68rem;
        max-width: 140px;
      }
    }

    /* Profile Info */
    .profile-info {
      margin-top: 10px;
      flex: 1;
      min-width: 280px;
    }

    .profile-info h1 {
      font-family: 'Darumadrop One', cursive, sans-serif;
      font-size: 2.3rem;
      font-weight: 400;
      color: var(--text-main);
      letter-spacing: 0.8px;
      line-height: 1.05;
      text-transform: lowercase;
    }

    .handle {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .bio {
      margin-top: 10px;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text-main);
      max-width: 850px;
      opacity: 0.95;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .tags {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      background-color: var(--lavender);
      color: #2b1742;
      border: 1px solid var(--border-crisp);
      cursor: pointer;
      box-shadow: 0 0 0 transparent;
      transition: transform 0.2s var(--spring-slide), background-color 0.18s ease, box-shadow 0.2s ease;
    }

    body.dark-mode .tag {
      background-color: #2b1a3f;
      color: var(--lavender);
    }

    .tag:hover,
    .tag:active {
      transform: translate(-3px, -3px);
      background-color: var(--soft-cyan) !important;
      color: #181124 !important;
      box-shadow: 3px 3px 0 var(--border-crisp);
    }

    /* Post Card */
    .post-card-inner {
      padding: 22px 24px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .post-mini-avatar {
      width: 44px;
      height: 44px;
      object-fit: cover;
      background: var(--lavender);
      border: 2px solid var(--border-crisp);
    }

    .post-author {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .post-time {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .post-content {
      font-size: 0.98rem;
      line-height: 1.65;
      color: var(--text-main);
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    /* Media Frame */
    .post-media-frame {
      display: inline-block;
      position: relative;
      max-width: 330px;
      background: var(--card-bg);
      border: 2px solid var(--border-crisp);
      margin-bottom: 16px;
      padding: 4px;
      box-shadow: 4px 4px 0 var(--placeholder-bg);
    }

    .post-media {
      max-width: 100%;
      max-height: 230px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .btn-fullscreen-trigger {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--border-crisp);
      color: var(--card-bg);
      border: 1px solid var(--border-crisp);
      width: 30px;
      height: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s var(--spring-slide);
    }

    .btn-fullscreen-trigger:hover {
      background: var(--soft-cyan);
      color: #181124;
      transform: translate(-2px, -2px);
    }

    /* Video Player */
    .cozy-player-wrapper {
      display: inline-block;
      position: relative;
      max-width: 360px;
      width: 100%;
      border: 2px solid var(--border-crisp);
      background: #000000;
      margin-bottom: 16px;
      box-shadow: 4px 4px 0 var(--placeholder-bg);
      overflow: hidden;
      user-select: none;
    }

    .cozy-player-wrapper:fullscreen,
    .cozy-player-wrapper:-webkit-full-screen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #000;
      margin: 0;
      border: none;
      box-shadow: none;
    }

    .cozy-player-wrapper:fullscreen .cozy-video-element,
    .cozy-player-wrapper:-webkit-full-screen .cozy-video-element {
      max-height: calc(100vh - 54px);
      height: 100%;
      width: 100%;
    }

    .cozy-player-wrapper:fullscreen .cozy-controls-bar,
    .cozy-player-wrapper:-webkit-full-screen .cozy-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(24, 17, 36, 0.96);
    }

    .cozy-video-element {
      width: 100%;
      max-height: 220px;
      display: block;
      object-fit: contain;
      cursor: pointer;
    }

    .player-center-play {
      position: absolute;
      top: calc(50% - 20px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: rgba(37, 20, 58, 0.9);
      border: 2px solid var(--lavender);
      color: var(--lavender);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
    }

    .cozy-player-wrapper.playing .player-center-play {
      opacity: 0;
      pointer-events: none;
    }

    .cozy-controls-bar {
      background: #25143a;
      border-top: 2px solid var(--border-crisp);
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(227, 215, 255, 0.25);
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      pointer-events: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cozy-ctrl-btn {
      background: transparent;
      border: none;
      color: var(--lavender);
      font-size: 0.92rem;
      cursor: pointer;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time-readout {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--lavender);
      letter-spacing: 0.5px;
    }

    /* Voting pill */
    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid var(--border-crisp);
      padding-top: 14px;
    }

    .vote-pill {
      display: inline-flex;
      align-items: center;
      background: var(--vote-bg);
      border: 2px solid var(--border-crisp);
    }

    .vote-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 800;
    }

    .vote-count {
      font-size: 0.88rem;
      font-weight: 800;
      min-width: 32px;
      text-align: center;
      color: var(--text-main);
      user-select: none;
    }

    .vote-btn.up.active {
      background-color: var(--green);
      color: #1b380b;
    }

    .vote-btn.down.active {
      background-color: var(--coral);
      color: #ffffff;
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 20, 16, 0.92);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-overlay.active {
      display: flex;
    }

    .lightbox-box {
      position: relative;
      background: var(--card-bg);
      border: 4px solid var(--border-crisp);
      outline: 3px solid var(--card-bg);
      max-width: 92vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close-btn {
      position: absolute;
      top: -18px;
      right: -18px;
      background: var(--coral);
      color: #ffffff;
      border: 2px solid var(--border-crisp);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top-Right Dark Mode Toggle -->
  <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="toggleTheme()">
    <i class="fa-solid fa-moon"></i>
  </button>

  <div class="container">
    
    <!-- Profile Card (Cover: cover.png, Profile: profile.png) -->
    <div class="pop-shell">
      <section class="slide-card">
        <div class="banner"></div>
        
        <div class="profile-details">
          <div class="avatar-wrapper">
            
            <!-- Live Last.fm Music Bubble -->
            <div class="music-bubble-container" id="musicBubbleContainer" style="display: none;">
              <a href="#" target="_blank" id="musicBubbleLink" class="music-bubble">
                <div class="equalizer-bars">
                  <span class="sound-bar"></span>
                  <span class="sound-bar"></span>
                  <span class="sound-bar"></span>
                </div>
                <div class="music-bubble-info">
                  <span class="music-title" id="musicTitle">Song Title</span>
                  <span class="music-artist" id="musicArtist">Artist Name</span>
                </div>
              </a>
              <div class="music-bubble-tail"></div>
              <div class="music-bubble-dot"></div>
            </div>

            <img class="avatar" src="profile.png" alt="prantik" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'" />
          </div>

          <div class="profile-info">
            <h1>prantik</h1>
            <div class="handle">@prantik</div>
            <p class="bio">
              your average tech dude who loves physics, math and music
            </p>

            <div class="tags">
              <span class="tag">#nerd</span>
              <span class="tag">#technophile</span>
              <span class="tag">#musicophile</span>
              <span class="tag">#chonically_online_guy</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Feed Container -->
    <main id="feedList" style="display: flex; flex-direction: column; gap: 28px;">
      <div style="padding: 24px; font-weight: 700; color: var(--text-muted); text-align: center;">
        Loading feed...
      </div>
    </main>

  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-overlay" id="lightboxModal" onclick="closeLightbox(event)">
    <div class="lightbox-box" onclick="event.stopPropagation()">
      <button class="lightbox-close-btn" onclick="closeLightbox(null)">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img class="lightbox-img" id="lightboxTargetImg" src="" alt="Full view" />
    </div>
  </div>

  <script>
    /* ===================================================
       CREDENTIAL CONFIGURATION
       Fill these in so phones, tablets, and all visitors can 
       connect to your feed and see your Last.fm bubble!
    =================================================== */
    const CONFIG_SUPABASE_URL = "";  // Paste your Supabase URL here e.g. "https://xxxx.supabase.co"
    const CONFIG_SUPABASE_KEY = "";  // Paste your Supabase Anon Key here
    const CONFIG_LASTFM_USER  = "";  // Paste your Last.fm username here
    const CONFIG_LASTFM_KEY   = "";  // Paste your Last.fm API Key here

    // Reads from CONFIG first, then falls back to localStorage
    const SUPABASE_URL = CONFIG_SUPABASE_URL || localStorage.getItem('SP_URL') || '';
    const SUPABASE_KEY = CONFIG_SUPABASE_KEY || localStorage.getItem('SP_KEY') || '';
    let supabaseClient = null;

    if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    /* ================= THEME TOGGLE ================= */
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const btn = document.getElementById('themeToggleBtn');
      btn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.body.classList.add('dark-mode');
        updateThemeIcon(true);
      } else {
        updateThemeIcon(false);
      }
    })();

    /* ================= LAST.FM STATUS ================= */
    async function initLastFm() {
      let username = CONFIG_LASTFM_USER || localStorage.getItem('LASTFM_USER') || '';
      let apiKey   = CONFIG_LASTFM_KEY  || localStorage.getItem('LASTFM_KEY')  || '';

      // If not filled in code, pull from Supabase site_settings table
      if ((!username || !apiKey) && supabaseClient) {
        try {
          const { data } = await supabaseClient.from('site_settings').select('*');
          if (data) {
            data.forEach(row => {
              if (row.key === 'lastfm_user') username = row.value;
              if (row.key === 'lastfm_key') apiKey = row.value;
            });
          }
        } catch (e) {}
      }

      if (!username || !apiKey) return;

      async function fetchNowPlaying() {
        try {
          const endpoint = `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(username)}&api_key=${encodeURIComponent(apiKey)}&format=json&limit=1`;
          const res = await fetch(endpoint);
          const data = await res.json();

          if (!data || !data.recenttracks || !data.recenttracks.track || data.recenttracks.track.length === 0) {
            return;
          }

          const track = data.recenttracks.track[0];
          const isPlaying = track['@attr'] && track['@attr'].nowplaying === 'true';

          const bubbleContainer = document.getElementById('musicBubbleContainer');
          const titleEl = document.getElementById('musicTitle');
          const artistEl = document.getElementById('musicArtist');
          const linkEl = document.getElementById('musicBubbleLink');

          titleEl.textContent = track.name;
          artistEl.textContent = typeof track.artist === 'object' ? track.artist['#text'] : track.artist;
          linkEl.href = track.url || 'https://www.last.fm';

          if (isPlaying) {
            bubbleContainer.classList.remove('paused');
          } else {
            bubbleContainer.classList.add('paused');
          }

          bubbleContainer.style.display = 'flex';
        } catch (err) {
          console.warn('Last.fm fetch error:', err);
        }
      }

      fetchNowPlaying();
      setInterval(fetchNowPlaying, 20000);
    }

    /* ================= FEED LOADER ================= */
    async function loadPosts() {
      const feedList = document.getElementById('feedList');
      if (!supabaseClient) {
        feedList.innerHTML = `
          <div class="pop-shell">
            <div class="slide-card" style="padding: 24px; text-align: center;">
              <h3>Welcome to prantik's corner.</h3>
              <p style="margin-top: 6px; color: var(--text-muted); font-size: 0.9rem;">
                No posts published yet.
              </p>
            </div>
          </div>
        `;
        return;
      }

      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data || data.length === 0) {
        feedList.innerHTML = `
          <div class="pop-shell">
            <div class="slide-card" style="padding: 24px; text-align: center;">
              <h3>Quiet for now.</h3>
              <p style="margin-top: 6px; color: var(--text-muted); font-size: 0.9rem;">
                Check back soon for fresh thoughts.
              </p>
            </div>
          </div>
        `;
        return;
      }

      feedList.innerHTML = '';
      data.forEach(post => {
        const shell = document.createElement('div');
        shell.className = 'pop-shell';
        
        let mediaHtml = '';
        if (post.image_url) {
          mediaHtml += `
            <div>
              <div class="post-media-frame">
                <button class="btn-fullscreen-trigger" title="Fullscreen" onclick="openLightbox('${escapeHTML(post.image_url)}')">
                  <i class="fa-solid fa-expand"></i>
                </button>
                <img class="post-media" src="${escapeHTML(post.image_url)}" alt="Post image" onclick="openLightbox(this.src)" />
              </div>
            </div>
          `;
        }

        if (post.video_url) {
          const playerId = `player-${post.id}`;
          mediaHtml += `
            <div>
              <div class="cozy-player-wrapper" id="${playerId}">
                <div class="player-center-play"><i class="fa-solid fa-play"></i></div>
                <video class="cozy-video-element" src="${escapeHTML(post.video_url)}" playsinline preload="metadata"></video>
                <div class="cozy-controls-bar">
                  <div class="progress-track"><div class="progress-fill"></div></div>
                  <div class="controls-row">
                    <div class="controls-left">
                      <button class="cozy-ctrl-btn btn-play-toggle"><i class="fa-solid fa-play"></i></button>
                      <button class="cozy-ctrl-btn btn-mute-toggle"><i class="fa-solid fa-volume-high"></i></button>
                      <span class="time-readout">0:00 / 0:00</span>
                    </div>
                    <div class="controls-right">
                      <button class="cozy-ctrl-btn btn-fs-toggle"><i class="fa-solid fa-expand"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        shell.innerHTML = `
          <article class="slide-card post-card-inner" data-id="${post.id}" data-votes="${post.votes}">
            <div class="post-header">
              <img class="post-mini-avatar" src="profile.png" alt="prantik" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'" />
              <div>
                <div class="post-author">prantik</div>
                <div class="post-time">${new Date(post.created_at).toLocaleDateString()}</div>
              </div>
            </div>
            <div class="post-content">${escapeHTML(post.content)}</div>
            ${mediaHtml}
            <div class="post-footer">
              <div class="vote-pill">
                <button class="vote-btn up" onclick="handleDbVote('${post.id}', 1, this)">▲</button>
                <span class="vote-count">${post.votes}</span>
                <button class="vote-btn down" onclick="handleDbVote('${post.id}', -1, this)">▼</button>
              </div>
              <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">
                ✦ verified post
              </div>
            </div>
          </article>
        `;

        feedList.appendChild(shell);
      });

      document.querySelectorAll('.cozy-player-wrapper').forEach(setupVideoPlayer);
    }

    /* ================= VOTING ================= */
    async function handleDbVote(postId, direction, btn) {
      if (!supabaseClient) return;
      const card = btn.closest('article');
      const countEl = card.querySelector('.vote-count');
      const upBtn = card.querySelector('.vote-btn.up');
      const downBtn = card.querySelector('.vote-btn.down');

      let currentVoted = card.getAttribute('data-voted') || 'none';
      let currentVotes = parseInt(card.getAttribute('data-votes'), 10);
      let diff = 0;

      if (direction === 1) {
        if (currentVoted === 'up') {
          currentVoted = 'none';
          diff = -1;
          upBtn.classList.remove('active');
        } else {
          diff = currentVoted === 'down' ? 2 : 1;
          currentVoted = 'up';
          upBtn.classList.add('active');
          downBtn.classList.remove('active');
        }
      } else {
        if (currentVoted === 'down') {
          currentVoted = 'none';
          diff = 1;
          downBtn.classList.remove('active');
        } else {
          diff = currentVoted === 'up' ? -2 : -1;
          currentVoted = 'down';
          downBtn.classList.add('active');
          upBtn.classList.remove('active');
        }
      }

      card.setAttribute('data-voted', currentVoted);
      const newTotal = currentVotes + diff;
      card.setAttribute('data-votes', newTotal);
      countEl.textContent = newTotal;

      await supabaseClient.from('posts').update({ votes: newTotal }).eq('id', postId);
    }

    /* ================= CUSTOM VIDEO PLAYER ================= */
    function setupVideoPlayer(wrapper) {
      const video = wrapper.querySelector('video');
      const playBtn = wrapper.querySelector('.btn-play-toggle');
      const centerPlay = wrapper.querySelector('.player-center-play');
      const muteBtn = wrapper.querySelector('.btn-mute-toggle');
      const fsBtn = wrapper.querySelector('.btn-fs-toggle');
      const track = wrapper.querySelector('.progress-track');
      const fill = wrapper.querySelector('.progress-fill');
      const timeText = wrapper.querySelector('.time-readout');
      const controlsBar = wrapper.querySelector('.cozy-controls-bar');

      controlsBar.addEventListener('click', (e) => e.stopPropagation());

      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function updatePlayState(isPlaying) {
        if (isPlaying) {
          wrapper.classList.add('playing');
          playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        } else {
          wrapper.classList.remove('playing');
          playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }
      }

      function togglePlay() {
        if (video.paused || video.ended) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      }

      playBtn.addEventListener('click', togglePlay);
      centerPlay.addEventListener('click', togglePlay);
      video.addEventListener('click', togglePlay);

      video.addEventListener('play', () => updatePlayState(true));
      video.addEventListener('pause', () => updatePlayState(false));
      video.addEventListener('ended', () => {
        updatePlayState(false);
        fill.style.width = '0%';
      });

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
      });

      video.addEventListener('timeupdate', () => {
        if (video.duration) {
          const pct = (video.currentTime / video.duration) * 100;
          fill.style.width = `${pct}%`;
          timeText.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }
      });

      video.addEventListener('loadedmetadata', () => {
        timeText.textContent = `0:00 / ${formatTime(video.duration)}`;
      });

      function handleSeek(e) {
        if (!video.duration) return;
        const rect = track.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        video.currentTime = pos * video.duration;
        fill.style.width = `${pos * 100}%`;
      }

      let isScrubbing = false;
      track.addEventListener('mousedown', (e) => {
        isScrubbing = true;
        handleSeek(e);
      });
      window.addEventListener('mousemove', (e) => {
        if (isScrubbing) handleSeek(e);
      });
      window.addEventListener('mouseup', () => {
        isScrubbing = false;
      });

      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement === wrapper) {
          fsBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
        } else {
          fsBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
        }
      });
    }

    function openLightbox(src) {
      const modal = document.getElementById('lightboxModal');
      document.getElementById('lightboxTargetImg').src = src;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
      if (!event || event.target.id === 'lightboxModal') {
        document.getElementById('lightboxModal').classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox(null);
    });

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    loadPosts();
    initLastFm();
  </script>
</body>
